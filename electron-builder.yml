appId: com.np-presspad.app
productName: NP Presspad
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/wp-offline-editor-companion.zip
    to: wp-offline-editor-companion.zip
  # Written by scripts/bundle-release-notes.mjs during `pnpm build`, so What's
  # New works offline rather than asking GitHub what was just installed.
  - from: resources/release-notes.md
    to: release-notes.md
publish:
  provider: github
  owner: cinsekrap
  repo: wp-offline-editor
mac:
  identity: "Nicolas Chambers-Parkes (J3ZA4LV4K6)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application needs access to store offline content.
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
