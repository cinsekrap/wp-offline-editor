name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Gate the release: no signed build unless typecheck, build, and tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (main / preload / shared)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Typecheck (renderer)
        run: npx tsc --noEmit -p tsconfig.web.json

      - run: pnpm build

      # Native module is built for Electron's ABI by postinstall; rebuild for the
      # Node ABI so vitest can load it (ERR_DLOPEN otherwise).
      - name: Rebuild native module for Node
        run: pnpm rebuild better-sqlite3-multiple-ciphers

      - name: Run tests
        run: pnpm test:ci

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install Apple intermediate CA (may already exist on runner)
          curl -sO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH" || true
          rm DeveloperIDG2CA.cer

      - name: Set version from tag
        run: node -e "const p=require('./package.json'); p.version='${GITHUB_REF_NAME#v}'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"

      - run: pnpm build

      # The plugin's update checker derives the available version from the
      # release TAG, so the shipped plugin header must match the tag or
      # WordPress offers an update that can never complete (installs, version
      # doesn't advance, offered again forever). Stamp at build time — the
      # plugin source in git stays untouched by app-only releases.
      - name: Stamp companion plugin version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' -E "s/^( \* Version: ).*/\1${VERSION}/" companion-plugin/wp-offline-editor-companion.php
          sed -i '' -E "s/define\( 'WPOE_VERSION', '[^']*' \);/define( 'WPOE_VERSION', '${VERSION}' );/" companion-plugin/wp-offline-editor-companion.php
          grep -q "^ \* Version: ${VERSION}$" companion-plugin/wp-offline-editor-companion.php
          grep -q "define( 'WPOE_VERSION', '${VERSION}' );" companion-plugin/wp-offline-editor-companion.php

      - name: Build companion plugin ZIP
        run: pnpm build:plugin

      # shell: bash gives -o pipefail, so the tee doesn't mask a build failure.
      - name: Build, sign, notarize, and upload (electron-builder)
        shell: bash
        run: pnpm exec electron-builder --mac --publish always 2>&1 | tee "${RUNNER_TEMP}/electron-builder.log"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder notarizes the app but does not staple a ticket to the
      # DMG, so `stapler validate` is the wrong assertion — its own
      # "notarization successful" log line is the check every published
      # release has been manually gated on.
      - name: Verify notarization succeeded
        run: |
          grep -q "notarization successful" "${RUNNER_TEMP}/electron-builder.log"
          echo "notarization successful — confirmed in build log"

      # electron-builder has been seen creating TWO draft releases for one tag
      # and splitting the assets between them (v1.1.6 and v1.1.7, both on
      # 26.15.3). Fold any duplicates into the draft with the most assets
      # before the companion upload and publish steps, which address the
      # release by tag and would otherwise pick one of them silently.
      - name: Consolidate duplicate draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          IDS=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name==\"${TAG}\") | .id")
          COUNT=$(echo "$IDS" | grep -c . || true)
          echo "Found ${COUNT} release object(s) for ${TAG}"
          if [ "$COUNT" -lt 1 ]; then echo "::error::No release found for ${TAG}"; exit 1; fi
          if [ "$COUNT" -eq 1 ]; then exit 0; fi
          TARGET=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name==\"${TAG}\")] | sort_by(.assets | length) | last | .id")
          echo "Consolidating into release ${TARGET}"
          for ID in $IDS; do
            [ "$ID" = "$TARGET" ] && continue
            gh api "repos/${GITHUB_REPOSITORY}/releases/${ID}" --jq '.assets[] | "\(.id) \(.name)"' |
            while read -r AID NAME; do
              echo "Moving ${NAME}"
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${AID}" > "${RUNNER_TEMP}/${NAME}"
              gh api --method POST -H "Content-Type: application/octet-stream" \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${TARGET}/assets?name=${NAME}" \
                --input "${RUNNER_TEMP}/${NAME}" > /dev/null
            done
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${ID}"
            echo "Deleted duplicate release ${ID}"
          done

      - name: Upload companion plugin to release
        run: gh release upload "v${GITHUB_REF_NAME#v}" resources/wp-offline-editor-companion.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release assets are complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .assets[].name")
          echo "${ASSETS}"
          for NAME in \
            "latest-mac.yml" \
            "NP-Presspad-${VERSION}-arm64-mac.zip" \
            "NP-Presspad-${VERSION}-arm64.dmg" \
            "NP-Presspad-${VERSION}-arm64.dmg.blockmap" \
            "NP.Presspad-${VERSION}-arm64-mac.zip.blockmap" \
            "wp-offline-editor-companion.zip"; do
            echo "${ASSETS}" | grep -qxF "${NAME}" || { echo "::error::Missing asset: ${NAME}"; exit 1; }
          done
          echo "All 6 expected assets present."

      # Publishing requires user-facing notes committed on main at
      # .github/release-notes/v<version>.md (first line = release title, blank
      # line, then the Markdown body). Notes are read from main's HEAD rather
      # than the tag, so committing notes after tagging and re-running this job
      # publishes. Without notes the release stays an unpublished draft.
      - name: Publish release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE=".github/release-notes/${TAG}.md"
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" \
              -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/notes-full.md" 2>/dev/null; then
            echo "::error::No release notes at ${FILE} on main — release left as draft. Commit the notes file and re-run this job to publish."
            exit 1
          fi
          TITLE=$(head -n1 "${RUNNER_TEMP}/notes-full.md" | sed 's/^#* *//')
          tail -n +2 "${RUNNER_TEMP}/notes-full.md" | sed '/./,$!d' > "${RUNNER_TEMP}/notes-body.md"
          if [ -z "${TITLE}" ]; then echo "::error::Notes file first line (title) is empty"; exit 1; fi
          if [ ! -s "${RUNNER_TEMP}/notes-body.md" ]; then echo "::error::Notes body is empty"; exit 1; fi
          gh release edit "${TAG}" --draft=false --latest --title "${TITLE}" --notes-file "${RUNNER_TEMP}/notes-body.md"
          echo "Published ${TAG}: ${TITLE}"
